# Bank Node C (rt.bank.c4) on a second OBP host: the local OBP-API B on :8081, with its
# own OBP-OIDC on :9001. Bank C is the receiving bank when bank A, on the first OBP host, pays
# through a hub bank (DOCS/MULTI_HOST_ROUTING.md). Until a node can be on several
# OBP hosts, it pays and is paid only by banks on OBP host B. Wallet secrets/node-c.skey, address
# in secrets/node-c.addr.
# Start from the repo root: dev/start_node_c.sh (it passes the node's OAuth2 client credentials
# from dev/local-b.env).

# The node's name, shown on its status pages (the same name the Bank Node UI configs use).
name: "node-c"

server:
  bind: "0.0.0.0:8093"   # 8090 is occupied by nginx on this machine

# The OBP hosts the node is on, each with the node's bank there. A hub bank lists several.
hosts:
  - obp_api:
      # The OBP host (here localhost:8081) is taken from base_url.
      base_url: "http://localhost:8081"
      # The node is a Platform App: it calls OBP-API as itself, with OAuth2 client credentials from
      # OBP-OIDC. The client id and secret are read from the environment variables named below, which
      # dev/start_node_c.sh sets from dev/local-b.env. They are never written in this file.
      token_url: "http://localhost:9001/obp-oidc/token"
      client_id_env: "NODE_C_CLIENT_ID"
      client_secret_env: "NODE_C_CLIENT_SECRET"
    rabbitmq:
      enabled: true
      host: "localhost"
      port: 5672
      username: "bank_c_node"
      password: "rtpass-c"
      virtual_host: "/bank.rt.bank.c4"
      request_queue: "obp_rpc_queue"
    bank:
      bank_id: "rt.bank.c4"
      account_id: "settlement-c"
      # One corridor account per sending currency. Authoritative when non-empty: a currency not
      # listed here is refused at initiation with 422 OBP-BANK-NODE-ROUTING-001.
      corridor_accounts:
        KES: "settlement-c"
        USD: "settlement-c-usd"
        JMD: "settlement-c-jmd"
      # The view the node creates Transaction Requests through on each corridor account: a custom
      # view with only can_add_transaction_request_to_any_account, given to the node's Consumer
      # (Consumer Account Access). dev/setup_obp.sh creates it and the grant.
      view_id: "_open-corridor-node"

blockchain:
  type: "cardano"
  cardano:
    ogmios_url: "ws://localhost:1337"
    network: "preprod"
    wallet_skey_path: "./secrets/node-c.skey"
    # UTxO-by-address scans the whole preprod UTxO set (~35s here); 15s default kills it.
    query_timeout_secs: 90

outbox:
  path: "./dev/data/node-c4/outbox.db"

evidence:
  path: "./dev/data/node-c4/evidence.db"

cbs_delivery:
  mode: "webhook_obp"
  webhook:
    url: "http://localhost:9009/credit-notifications"
    timeout_seconds: 10

local_secret: "rt-local-secret"
