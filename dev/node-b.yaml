# Round-trip test — Bank Node B (rt.bank.b2, Cardano preprod rail — symmetric
# with node A so B can also write promises and settle as debtor; wallet is
# secrets/creditor.skey, address addr_test1vqn7sn79...).
# Start from the repo root:
#   source dev/env.sh
#   OBP_BANK_NODE_CONFIG=dev/node-b.yaml \
#   OBP_BN_OBP_API__DIRECT_LOGIN_TOKEN="$RT_NODE_B_TOKEN" cargo run -p obp-bank-node

server:
  bind: "0.0.0.0:8089"

bank:
  bank_id: "rt.bank.b2"
  account_id: "settlement-b"

obp_api:
  base_url: "http://localhost:8080"

blockchain:
  type: "cardano"
  cardano:
    ogmios_url: "ws://localhost:1337"
    network: "preprod"
    wallet_skey_path: "./secrets/creditor.skey"
    # UTxO-by-address scans the whole preprod UTxO set (~35s here); 15s default kills it.
    query_timeout_secs: 90

outbox:
  path: "./dev/data/node-b2/outbox.db"

evidence:
  path: "./dev/data/node-b2/evidence.db"

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  username: "bank_b_node"
  password: "rtpass-b"
  virtual_host: "/bank.rt.bank.b2"
  request_queue: "obp_rpc_queue"

cbs_delivery:
  mode: "webhook_obp"
  webhook:
    url: "http://localhost:9009/credit-notifications"
    timeout_seconds: 10

local_secret: "rt-local-secret"
