# Round-trip test — Bank Node B (rt.bank.b4, Cardano preprod rail — symmetric
# with node A so B can also write promises and settle as debtor; wallet is
# secrets/creditor.skey, address in secrets/creditor.addr).
# Start from the repo root: dev/start_node_b.sh (it passes the node's OAuth2 client
# credentials from dev/local.env).

server:
  bind: "0.0.0.0:8089"

bank:
  bank_id: "rt.bank.b4"
  account_id: "settlement-b"
  # One corridor account per sending currency (created via the app's setup
  # page). Authoritative when non-empty: a currency not listed here is
  # refused at initiation with 422 OBP-BANK-NODE-ROUTING-001.
  corridor_accounts:
    KES: "settlement-b"
    NGN: "settlement-b-ngn"
    USD: "settlement-b-usd"
    EUR: "settlement-b-eur"
  # The view the node creates Transaction Requests through on each corridor account: a custom
  # view with only can_add_transaction_request_to_any_account, given to the node's Consumer
  # (Consumer Account Access). dev/setup_obp.sh creates it and the grant.
  view_id: "_open-corridor-node"

obp_api:
  base_url: "http://localhost:8080"
  # The node is a Platform App: it calls OBP-API as itself, with OAuth2 client credentials from
  # OBP-OIDC. client_id / client_secret come from dev/local.env (start_node_b.sh passes them).
  token_url: "http://localhost:9000/obp-oidc/token"

blockchain:
  type: "cardano"
  cardano:
    ogmios_url: "ws://localhost:1337"
    network: "preprod"
    wallet_skey_path: "./secrets/creditor.skey"
    # UTxO-by-address scans the whole preprod UTxO set (~35s here); 15s default kills it.
    query_timeout_secs: 90

outbox:
  path: "./dev/data/node-b4/outbox.db"

evidence:
  path: "./dev/data/node-b4/evidence.db"

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  username: "bank_b_node"
  password: "rtpass-b"
  virtual_host: "/bank.rt.bank.b4"
  request_queue: "obp_rpc_queue"

cbs_delivery:
  mode: "webhook_obp"
  webhook:
    url: "http://localhost:9009/credit-notifications"
    timeout_seconds: 10

local_secret: "rt-local-secret"
