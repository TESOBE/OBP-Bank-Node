# Bank Node App for bank A — locked to its own node (rt.bank.a3), exactly as
# a bank client using Open Corridor would deploy it. The localhost demo runs
# a second instance (app-b.yaml) so both banks' views sit side by side.
# Start from the repo root:
#   OBP_BANK_NODE_APP_CONFIG=dev/app-a.yaml cargo run -p obp-bank-node-app

server:
  bind: "0.0.0.0:8091"   # 8090 is occupied by nginx on this machine

nodes:
  - name: "node-a"
    base_url: "http://localhost:8088"

# Form prefill for this instance, keyed by form-field name (Send + Settle).
# Out-of-band knowledge of the demo topology — the app never enumerates the
# other bank's accounts.
ui_defaults:
  beneficiary_name: "Beneficiary at rt.bank.b3"
  other_bank: "rt.bank.b3"
  other_account: "settlement-b"
  other_bank_id: "rt.bank.b3"

# --- /setup operator page -------------------------------------------------
# OBP-API + OIDC client for the setup page (the Portal's login scheme: the
# provider comes from OBP-API's /obp/v5.1.0/well-known, the admin logs in
# interactively, this app exchanges the code server-side). The consumer must
# be registered in OBP with redirect URL http://localhost:8091/setup/callback;
# put its key/secret here or via env:
#   OBP_BN_APP_OBP_API__OAUTH_CLIENT_ID=... OBP_BN_APP_OBP_API__OAUTH_CLIENT_SECRET=...
# Consumer 'obp-bank-node-app-8091-setup' (registered 2026-08-08 via
# POST /obp/v5.1.0/management/consumers; localhost-dev credentials, same
# class as the broker passwords below).
obp_api:
  base_url: "http://localhost:8080"
  oauth_provider: "obp-oidc"
  oauth_client_id: "xu5htct5zlvmshfvmfruc2riay3pd4uone5jb3ov"
  oauth_client_secret: "pnp0v1vjl5f5r5o123hrrgreslxgtqie2oojwf0a"
  callback_url: "http://localhost:8091/setup/callback"

# Desired Open Corridor state the setup page reconciles OBP-API against.
# Single-bank (2026-08-09): this instance acts for its own bank only — the
# other bank's setup is that bank's own app instance's job. Routing schemes
# are the system-level catalogue (API-operator scope in production; carried
# here for dev). The node service users are provisioned by setup_obp.sh;
# the page only checks/grants their roles.
setup:
  routing_schemes:
    - scheme: "OBP"
      country: "INT"
      category: "ACCOUNT"
      address_pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      example_address: "rt.bank.b3"
      description: "OBP bank id or account id, as used in OBP account routings."
      downstream_rails: []
      status: "ACTIVE"
    - scheme: "IBAN"
      country: "INT"
      category: "ACCOUNT"
      address_pattern: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}$"
      example_address: "GB29NWBK60161331926819"
      description: "International Bank Account Number (ISO 13616), no spaces."
      downstream_rails: []
      status: "ACTIVE"
    - scheme: "BIC"
      country: "INT"
      category: "BANK"
      address_pattern: "^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$"
      example_address: "NWBKGB2LXXX"
      description: "ISO 9362 Business Identifier Code, 8 or 11 characters."
      downstream_rails: []
      status: "ACTIVE"
    - scheme: "CARDANO"
      country: "INT"
      category: "ACCOUNT"
      address_pattern: "^addr(_test)?1[a-z0-9]{20,120}$"
      example_address: "addr_test1vqn7sn79x6k9a2353l458mk2gccmwqk7nza93zydpuvl7lquy6jcl"
      description: "Cardano bech32 payment address. On OBP-INCOMING-SETTLEMENT-ACCOUNT it is the bank's Open Corridor settlement address."
      downstream_rails: ["cardano"]
      status: "ACTIVE"
    - scheme: "ETHEREUM"
      country: "INT"
      category: "ACCOUNT"
      address_pattern: "^0x[0-9a-fA-F]{40}$"
      example_address: "0x71C7656EC7ab88b098defB751B7401B5f6d8976F"
      description: "Ethereum EIP-55 address. Reserved for a future settlement rail."
      downstream_rails: []
      status: "RESERVED"

  bank:
    id: "rt.bank.a3"
    full_name: "Round-trip rt.bank.a3"
    accounts:
      - id: "settlement-a"
        label: "Node A corridor account"
        currency: "KES"
        owner_username: "rt.node.a"
      - id: "OBP-OUTGOING-SETTLEMENT-ACCOUNT"
        label: "OC outgoing settlement"
        currency: "KES"
      - id: "OBP-INCOMING-SETTLEMENT-ACCOUNT"
        label: "OC incoming settlement"
        currency: "KES"
        routings:
          - { scheme: "CARDANO", address: "addr_test1vz233470pc30zzsceh9k2qmzkj4gvj7n976ulvdmed5w9mg0a37ns" }
    fx:
      - { from_currency: "EUR", to_currency: "KES", rate: 150.0, inverse_rate: 0.006667 }
      - { from_currency: "KES", to_currency: "EUR", rate: 0.006667, inverse_rate: 150.0 }
    broker:
      host: "localhost"
      port: 5672
      virtual_host: "/bank.rt.bank.a3"
      username: "bank_a_node"
      password: "rtpass-a"
      use_ssl: false
    role_grants:
      - { username: "rt.node.a", role: "CanAttachOpenCorridorPromise" }
      - { username: "rt.node.a", role: "CanSettleOpenCorridor" }
