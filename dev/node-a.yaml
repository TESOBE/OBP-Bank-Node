# Round-trip test — Bank Node A (debtor, rt.bank.a3, Cardano preprod).
# Start from the repo root:
#   source dev/env.sh
#   OBP_BANK_NODE_CONFIG=dev/node-a.yaml \
#   OBP_BN_OBP_API__DIRECT_LOGIN_TOKEN="$RT_NODE_A_TOKEN" cargo run -p obp-bank-node

server:
  bind: "0.0.0.0:8088"

bank:
  bank_id: "rt.bank.a3"
  account_id: "settlement-a"

obp_api:
  base_url: "http://localhost:8080"
  # direct_login_token comes from the environment (env.sh, written by setup_obp.sh)

blockchain:
  type: "cardano"
  cardano:
    ogmios_url: "ws://localhost:1337"
    network: "preprod"
    wallet_skey_path: "./secrets/cardano.skey"
    # UTxO-by-address scans the whole preprod UTxO set (~35s here); 15s default kills it.
    query_timeout_secs: 90

outbox:
  path: "./dev/data/node-a3/outbox.db"

evidence:
  path: "./dev/data/node-a3/evidence.db"

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  username: "bank_a_node"
  password: "rtpass-a"
  virtual_host: "/bank.rt.bank.a3"
  request_queue: "obp_rpc_queue"

cbs_delivery:
  mode: "webhook_obp"
  webhook:
    url: "http://localhost:9009/credit-notifications"
    timeout_seconds: 10

settlement:
  # Cross rate: ADA/USD (CoinGecko) × USD/KES (open.er-api.com) — CoinGecko
  # alone dropped KES from vs_currencies (2026-07-31). Switch the crypto leg
  # to API3 with fx_crypto_leg: "api3" + fx_api3_rpc_url +
  # fx_api3_proxy_address (ADA/USD proxy from the API3 Market).
  fx_source: "cross"
  # Fast finality for the test run (2 blocks ≈ 40 s on preprod).
  finality_depth: 2
  finality_poll_secs: 10
  store_path: "./dev/data/node-a3/settlements.db"
  ada_rate_minor_per_whole_ada: 2122

local_secret: "rt-local-secret"
