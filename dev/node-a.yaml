# Round-trip test — Bank Node A (debtor, rt.bank.a3, Cardano preprod).
# Start from the repo root: dev/start_node_a.sh (it passes the node's OAuth2 client
# credentials from dev/local.env).

server:
  bind: "0.0.0.0:8088"

bank:
  bank_id: "rt.bank.a3"
  account_id: "settlement-a"
  # One corridor account per sending currency (created via the app's setup
  # page). Authoritative when non-empty: a currency not listed here is
  # refused at initiation with 422 OBP-BANK-NODE-ROUTING-001.
  corridor_accounts:
    KES: "settlement-a"
    NGN: "settlement-a-ngn"
    USD: "settlement-a-usd"
    EUR: "settlement-a-eur"
  # The view the node creates Transaction Requests through on each corridor account: a custom
  # view with only can_add_transaction_request_to_any_account, given to the node's Consumer
  # (Consumer Account Access). dev/setup_obp.sh creates it and the grant.
  view_id: "_open-corridor-node"

obp_api:
  base_url: "http://localhost:8080"
  # The node is a Platform App: it calls OBP-API as itself, with OAuth2 client credentials from
  # OBP-OIDC. client_id / client_secret come from dev/local.env (start_node_a.sh passes them).
  token_url: "http://localhost:9000/obp-oidc/token"

blockchain:
  type: "cardano"
  cardano:
    ogmios_url: "ws://localhost:1337"
    network: "preprod"
    wallet_skey_path: "./secrets/cardano.skey"
    # UTxO-by-address scans the whole preprod UTxO set (~35s here); 15s default kills it.
    query_timeout_secs: 90

outbox:
  path: "./dev/data/node-a3/outbox.db"

evidence:
  path: "./dev/data/node-a3/evidence.db"

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  username: "bank_a_node"
  password: "rtpass-a"
  virtual_host: "/bank.rt.bank.a3"
  request_queue: "obp_rpc_queue"

cbs_delivery:
  mode: "webhook_obp"
  webhook:
    url: "http://localhost:9009/credit-notifications"
    timeout_seconds: 10

settlement:
  # Cross rate. Default legs try Pyth first, then fall back:
  # crypto [pyth, coingecko] × fiat [pyth, er-api]. Pin an order with e.g.
  # fx_crypto_leg: ["api3", "coingecko"] ("api3" also needs fx_api3_rpc_url +
  # fx_api3_proxy_address, ADA/USD proxy from the API3 Market).
  fx_source: "cross"
  # Fast finality for the test run (2 blocks ≈ 40 s on preprod).
  finality_depth: 2
  finality_poll_secs: 10
  store_path: "./dev/data/node-a3/settlements.db"
  ada_rate_minor_per_whole_ada: 2122

local_secret: "rt-local-secret"
