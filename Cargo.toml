[workspace]
resolver = "2"
members = [
    "crates/obp-bank-node",
    "crates/obp-bank-node-app",
    "crates/obp-blockchain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.75"
authors = ["TESOBE GmbH"]
repository = "https://github.com/OpenBankProject/OBP-Bank-Node"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
anyhow = "1"
thiserror = "1"

# serialization
serde = { version = "1", features = ["derive"] }
# preserve_order: relayed OBP-API bodies keep their original key order
serde_json = { version = "1", features = ["preserve_order"] }

# config
figment = { version = "0.10", features = ["yaml", "env"] }

# HTTP server / middleware
axum = "0.7"
tower-http = { version = "0.5", features = ["trace"] }

# HTTP client (Interface B — OBP API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# AMQP / RabbitMQ (Interface C — inbound from OBP API)
lapin = "2"
tokio-executor-trait = "3"
tokio-reactor-trait = "1"

# durable outbox (SQLite)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
] }

# misc
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# WebSocket / Ogmios JSON-RPC
tokio-tungstenite = "0.21"
futures-util = "0.3"

# routing-scheme address validation
regex = "1"

# cryptography & encoding
hex = "0.4"
ed25519-dalek = { version = "2", features = ["zeroize"] }
rand = "0.8"
base64 = "0.22"

# Internal crates
obp-blockchain = { path = "crates/obp-blockchain" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
