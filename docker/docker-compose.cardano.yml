# Local Cardano stack for OBP Bank Node development.
#
# Network: PREPROD. Preprod mirrors mainnet config, uses released tooling,
# and is the recommended staging environment for anything heading to mainnet.
#
# Sync: from a certified Mithril snapshot (`cardano-bootstrap.sh mithril`,
# about an hour), or from genesis if you skip that (12-20 h or more). Either
# way it resumes in seconds on every restart.
#
# Usage:
#   ./docker/cardano-bootstrap.sh up       # start, don't wait
#   ./docker/cardano-bootstrap.sh mithril  # replace the chain DB with a snapshot
#   ./docker/cardano-bootstrap.sh status   # show sync progress
#   ./docker/cardano-bootstrap.sh down     # stop, keep chain DB
#   ./docker/cardano-bootstrap.sh nuke     # stop + delete chain DB
#
# Volumes:
#   cardano-db  — chain DB (from a Mithril snapshot, or synced from genesis)
#
# Ports:
#   1337  — Ogmios JSON-RPC over WebSocket / HTTP

services:

  # cardano-node + Ogmios in one container. Versions pre-matched by
  # CardanoSolutions to known-good combinations.
  cardano-node-ogmios:
    # node 11.x required: preprod hard-forked past node 10.5 around 2026-05-22
    # (a 10.5.1 node wedges silently at that slot with healthy peering).
    # Fully qualified for podman hosts with short-name resolution enforced.
    image: docker.io/cardanosolutions/cardano-node-ogmios:v7.0.0_11.0.1-preprod
    ports:
      - "1337:1337"  # Ogmios JSON-RPC
    volumes:
      - cardano-db:/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1337/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cardano-db:
