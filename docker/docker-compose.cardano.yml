# Local Cardano stack for OBP Bank Node development.
#
# Stands up:
#   - cardano-node + Ogmios (combined image, versions pre-matched)
#   - one-shot Mithril bootstrap that downloads the latest preview snapshot
#     so the node does NOT have to sync from genesis (~30 min vs 4-12 h)
#
# Usage:
#   docker compose -f docker/docker-compose.cardano.yml up -d
#   curl http://localhost:1337/health   # ogmios health
#
# Volumes:
#   cardano-db  — chain DB (bootstrapped from Mithril)
#
# Ports:
#   1337  — Ogmios JSON-RPC over WebSocket / HTTP

services:

  # One-shot: download latest Mithril snapshot into the cardano-db volume
  # BEFORE cardano-node-ogmios starts. Skipped on subsequent runs because
  # the snapshot is already on disk.
  mithril-bootstrap:
    image: ghcr.io/input-output-hk/mithril-client:latest
    environment:
      - AGGREGATOR_ENDPOINT=https://aggregator.pre-release-preview.api.mithril.network/aggregator
      # Genesis verification key fetched at runtime from the IOG mithril repo
      # (path is the canonical location maintained by the Mithril team).
      - GENESIS_VERIFICATION_KEY=https://raw.githubusercontent.com/input-output-hk/mithril/main/mithril-infra/configuration/pre-release-preview/genesis.vkey
    volumes:
      - cardano-db:/db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -d /db/immutable ] && [ "$(ls -A /db/immutable 2>/dev/null)" ]; then
          echo "[mithril] cardano-db already populated; skipping bootstrap"
          exit 0
        fi
        echo "[mithril] fetching genesis verification key..."
        GVK=$(wget -qO- "$GENESIS_VERIFICATION_KEY")
        export GENESIS_VERIFICATION_KEY="$GVK"
        echo "[mithril] downloading latest cardano-db snapshot to /db..."
        /app/bin/mithril-client cardano-db download --include-ancillary latest --download-dir /db
        echo "[mithril] bootstrap complete"
    restart: "no"

  # cardano-node + Ogmios in one container. Versions pre-matched by
  # CardanoSolutions to known-good combinations.
  cardano-node-ogmios:
    image: cardanosolutions/cardano-node-ogmios:v6.14.0_10.5.1-preview
    depends_on:
      mithril-bootstrap:
        condition: service_completed_successfully
    ports:
      - "1337:1337"  # Ogmios JSON-RPC
    volumes:
      - cardano-db:/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1337/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cardano-db:
